services:
  dev:
    build: .
    volumes:
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true

    
  streamlit:
    build: .
    command: streamlit run app/interface.py --browser.gatherUsageStats false --server.port 8501
    volumes:
      - .:/workspace
    working_dir: /workspace
    ports:
      - "8501:8501"

